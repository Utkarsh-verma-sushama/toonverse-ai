<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/toonverse-icon.svg" type="image/svg+xml"><meta name="theme-color" content="#070b17">
<title>Smart Auto Layout — ToonVerse AI</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at 10% 0,#24205b,transparent 30%),#070b17}button,input,select{font:inherit}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #ffffff18;background:#0d1530ed;position:sticky;top:0;z-index:20}.brand,.home{color:#fff;text-decoration:none}.brand{font-weight:900}.home,.btn{min-height:44px;border:1px solid #ffffff20;border-radius:11px;padding:9px 13px;color:#fff;background:#ffffff08;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#765cff,#ff3d9a);font-weight:800}.btn:disabled{opacity:.45;cursor:not-allowed}.workspace{min-height:0;display:grid;grid-template-columns:310px minmax(0,1fr) 290px}.panel{padding:16px;border-right:1px solid #ffffff14;background:#0d1429e8;overflow:auto}.panel.right{border-right:0;border-left:1px solid #ffffff14}.panel h1{font-size:21px;margin:0 0 7px}.panel h2{font-size:13px;margin:19px 0 9px;text-transform:uppercase;letter-spacing:.08em;color:#c9d1ea}.muted{color:#9eabc9;font-size:12px;line-height:1.5}.drop{display:grid;place-items:center;min-height:128px;margin-top:14px;padding:16px;border:1px dashed #8f7cff;border-radius:15px;text-align:center;background:#765cff10;cursor:pointer}.drop.drag{background:#765cff25}.drop input{position:absolute;opacity:0;pointer-events:none}.list{display:grid;gap:7px;margin-top:12px}.item{display:flex;align-items:center;gap:9px;padding:8px;border:1px solid #ffffff14;border-radius:11px;background:#ffffff05}.thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#111a31}.info{min-width:0;flex:1}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:700}.meta{font-size:9px;color:#8f9ab7;margin-top:3px}.iconbtn{width:36px;height:36px;border:1px solid #ffffff1a;border-radius:9px;color:#fff;background:#ffffff08;cursor:pointer}.stage{min-width:0;min-height:0;display:grid;place-items:center;overflow:auto;padding:24px;background-color:#090e1b;background-image:linear-gradient(45deg,#ffffff05 25%,transparent 25%),linear-gradient(-45deg,#ffffff05 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ffffff05 75%),linear-gradient(-45deg,transparent 75%,#ffffff05 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.canvas-wrap{max-width:100%;max-height:100%;box-shadow:0 25px 70px #0009}.canvas-wrap canvas{display:block;max-width:min(100%,900px);max-height:calc(100dvh - 120px);background:#fff}.field{display:grid;gap:6px;margin-bottom:11px}.field label{font-size:11px;color:#c5cee6}.field input,.field select{width:100%;min-height:42px;border:1px solid #ffffff1c;border-radius:10px;padding:8px;color:#fff;background:#091026}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:grid;gap:8px;margin-top:14px}.status{margin-top:12px;padding:10px;border:1px solid #ffffff14;border-radius:10px;color:#b9c3df;background:#ffffff05;font-size:11px;line-height:1.45}.empty{padding:10px;border:1px dashed #ffffff20;border-radius:10px;color:#8f9ab7;font-size:11px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.drop:focus-visible{outline:3px solid #c8bfff;outline-offset:3px}@media(max-width:900px){.workspace{grid-template-columns:1fr}.panel{border:0;border-bottom:1px solid #ffffff14}.panel.right{border:0;border-top:1px solid #ffffff14}.stage{min-height:52vh;padding:12px}.canvas-wrap canvas{max-height:50vh}}@media(pointer:coarse){button,input,select,.drop{min-height:48px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><div class="app">
<header class="top"><a class="home" href="./create.html" aria-label="Back to Create Studio">← Create</a><a class="brand" href="./index.html">✨ ToonVerse AI</a><button class="btn primary" id="export-top" disabled>Export PNG</button></header>
<main class="workspace">
<aside class="panel"><h1>Smart Auto Layout</h1><p class="muted">Turn multiple images into a polished composition while preserving every original.</p>
<label class="drop" id="drop" tabindex="0"><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif" multiple><span>📁<br><strong>Add images</strong><br><span class="muted">Tap, browse or drop up to 12 files</span></span></label>
<h2>Media order</h2><div class="list" id="list"><div class="empty">No images selected.</div></div>
<div class="actions"><button class="btn" id="shuffle" disabled>Shuffle order</button><button class="btn" id="clear" disabled>Clear all</button></div></aside>
<section class="stage" aria-label="Composition preview"><div class="canvas-wrap"><canvas id="canvas" width="1080" height="1080" aria-label="Auto layout preview"></canvas></div></section>
<aside class="panel right"><h2 style="margin-top:0">Layout settings</h2>
<div class="field"><label for="preset">Canvas preset</label><select id="preset"><option value="square">Square post · 1080×1080</option><option value="portrait">Portrait post · 1080×1350</option><option value="story">Story/Short · 1080×1920</option><option value="landscape">Landscape · 1920×1080</option><option value="banner">Wide banner · 1600×900</option></select></div>
<div class="field"><label for="layout">Composition</label><select id="layout"><option value="auto">Intelligent Auto</option><option value="grid">Balanced Grid</option><option value="hero">Hero + Supporting</option><option value="split">Split Focus</option><option value="strip">Editorial Strip</option></select></div>
<div class="two"><div class="field"><label for="gap">Gap</label><input id="gap" type="range" min="0" max="60" value="18"></div><div class="field"><label for="radius">Corners</label><input id="radius" type="range" min="0" max="80" value="24"></div></div>
<div class="field"><label for="background">Background</label><input id="background" type="color" value="#111827"></div>
<div class="field"><label for="fit">Image placement</label><select id="fit"><option value="cover">Fill frame</option><option value="contain">Show full image</option></select></div>
<div class="actions"><button class="btn primary" id="compose" disabled>Build layout</button><button class="btn" id="export" disabled>Export PNG</button></div>
<div class="status" id="status" role="status" aria-live="polite">Add images to begin. Rendering stays on this device.</div>
</aside></main></div>
<script>
(() => {"use strict";
const $=id=>document.getElementById(id), canvas=$("canvas"),ctx=canvas.getContext("2d"),input=$("files"),drop=$("drop"),list=$("list"),status=$("status");
let media=[],busy=false;
const limits=()=>{const low=Number(navigator.deviceMemory)>0&&Number(navigator.deviceMemory)<=4;return{maxFiles:12,maxBytes:low?120*1024*1024:300*1024*1024,maxPixels:low?28e6:50e6}};
const notify=(m,t="info")=>{status.textContent=m;status.style.borderColor=t==="error"?"#ef444466":t==="success"?"#22c55e66":"#ffffff14"};
const decode=async file=>{if(typeof createImageBitmap==="function"){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch{}}const url=URL.createObjectURL(file);try{return await new Promise((res,rej)=>{const im=new Image;im.onload=()=>res(im);im.onerror=()=>rej(new Error("Image could not be decoded."));im.src=url})}finally{URL.revokeObjectURL(url)}};
function syncButtons(){const ready=media.length>0;["shuffle","clear","compose","export","export-top"].forEach(id=>$(id).disabled=!ready||busy)}
function renderList(){list.replaceChildren();if(!media.length){const e=document.createElement("div");e.className="empty";e.textContent="No images selected.";list.append(e);syncButtons();return}media.forEach((item,index)=>{const row=document.createElement("div");row.className="item";const img=document.createElement("img");img.className="thumb";img.src=item.preview;img.alt="";const info=document.createElement("div");info.className="info";const name=document.createElement("div");name.className="name";name.textContent=item.file.name;const meta=document.createElement("div");meta.className="meta";meta.textContent=`${item.width}×${item.height}`;info.append(name,meta);const up=document.createElement("button");up.className="iconbtn";up.textContent="↑";up.ariaLabel="Move image up";up.disabled=index===0;up.onclick=()=>{[media[index-1],media[index]]=[media[index],media[index-1]];renderList();compose()};const down=document.createElement("button");down.className="iconbtn";down.textContent="↓";down.ariaLabel="Move image down";down.disabled=index===media.length-1;down.onclick=()=>{[media[index+1],media[index]]=[media[index],media[index+1]];renderList();compose()};const del=document.createElement("button");del.className="iconbtn";del.textContent="×";del.ariaLabel="Remove image";del.onclick=()=>{URL.revokeObjectURL(item.preview);item.bitmap.close?.();media.splice(index,1);renderList();compose()};row.append(img,info,up,down,del);list.append(row)});syncButtons()}
async function addFiles(files){const lim=limits(),incoming=Array.from(files||[]).slice(0,lim.maxFiles-media.length),total=incoming.reduce((n,f)=>n+f.size,media.reduce((n,x)=>n+x.file.size,0));if(total>lim.maxBytes){notify("These files exceed the safe memory limit for this device.","error");return}busy=true;syncButtons();for(const file of incoming){if(!/^image\/(jpeg|png|webp|avif|heic|heif)$/i.test(file.type)&&!/[.](jpe?g|png|webp|avif|heic|heif)$/i.test(file.name)){continue}try{const bitmap=await decode(file),width=bitmap.naturalWidth||bitmap.width,height=bitmap.naturalHeight||bitmap.height;if(width*height>lim.maxPixels){bitmap.close?.();continue}media.push({file,bitmap,width,height,preview:URL.createObjectURL(file)})}catch(e){console.warn(e)}}busy=false;renderList();if(media.length){compose();notify(`${media.length} image${media.length===1?"":"s"} ready.`,"success")}else notify("No supported images could be decoded.","error")}
function cells(n,type,w,h,g){if(type==="auto")type=n<=2?"split":n>=4?"hero":"grid";if(type==="split"){if(n===1)return[[g,g,w-2*g,h-2*g]];return Array.from({length:n},(_,i)=>[g+i*(w-3*g)/n,g,(w-(n+1)*g)/n,h-2*g])}if(type==="strip"){return Array.from({length:n},(_,i)=>[g,g+i*(h-(n+1)*g)/n,w-2*g,(h-(n+1)*g)/n])}if(type==="hero"&&n>1){const left=Math.round(w*.62);const out=[[g,g,left-1.5*g,h-2*g]],rows=n-1;for(let i=0;i<rows;i++)out.push([left+.5*g,g+i*(h-(rows+1)*g)/rows,w-left-1.5*g,(h-(rows+1)*g)/rows]);return out}const cols=Math.ceil(Math.sqrt(n*w/h)),rows=Math.ceil(n/cols),cw=(w-(cols+1)*g)/cols,ch=(h-(rows+1)*g)/rows;return Array.from({length:n},(_,i)=>[g+(i%cols)*(cw+g),g+Math.floor(i/cols)*(ch+g),cw,ch])}
function rounded(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h));ctx.clip()}
function draw(item,box,fit){const[x,y,w,h]=box,ir=item.width/item.height,br=w/h;let dw,dh;if((fit==="cover"&&ir>br)||(fit==="contain"&&ir<br)){dh=h;dw=h*ir}else{dw=w;dh=w/ir}ctx.drawImage(item.bitmap,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}
function compose(){const sizes={square:[1080,1080],portrait:[1080,1350],story:[1080,1920],landscape:[1920,1080],banner:[1600,900]},[w,h]=sizes[$("preset").value]||sizes.square,lim=limits();if(w*h>lim.maxPixels){notify("Canvas preset is too large for this device.","error");return}canvas.width=w;canvas.height=h;ctx.fillStyle=$("background").value;ctx.fillRect(0,0,w,h);if(!media.length){ctx.fillStyle="#94a3b8";ctx.textAlign="center";ctx.font="28px Arial";ctx.fillText("Add images to build a layout",w/2,h/2);syncButtons();return}const boxes=cells(media.length,$("layout").value,w,h,Number($("gap").value));boxes.forEach((box,i)=>{ctx.save();rounded(...box,Number($("radius").value));draw(media[i],box,$("fit").value);ctx.restore()});syncButtons()}
async function exportPng(){if(!media.length||busy)return;busy=true;syncButtons();notify("Preparing full-resolution PNG…");try{const blob=await new Promise(res=>canvas.toBlob(res,"image/png"));if(!blob)throw new Error("PNG export is unavailable.");const a=document.createElement("a"),url=URL.createObjectURL(blob);a.href=url;a.download=`toonverse-auto-layout-${Date.now()}.png`;a.rel="noopener";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notify("Layout exported successfully.","success")}catch(e){notify(e.message||"Export failed.","error")}finally{busy=false;syncButtons()}}
input.onchange=()=>addFiles(input.files);["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",e=>addFiles(e.dataTransfer.files));drop.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();input.click()}});
$("shuffle").onclick=()=>{for(let i=media.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[media[i],media[j]]=[media[j],media[i]]}renderList();compose()};
$("clear").onclick=()=>{media.forEach(x=>{URL.revokeObjectURL(x.preview);x.bitmap.close?.()});media=[];renderList();compose();notify("Composition cleared.")};
["preset","layout","gap","radius","background","fit"].forEach(id=>$(id).addEventListener("input",compose));$("compose").onclick=compose;$("export").onclick=exportPng;$("export-top").onclick=exportPng;
window.addEventListener("pagehide",()=>media.forEach(x=>URL.revokeObjectURL(x.preview)));compose();syncButtons();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn),{once:true});
})();
</script></body></html>
