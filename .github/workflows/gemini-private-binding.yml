name: Bind Gemini key to private adapter staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uvenaro-gemini-private-binding
  cancel-in-progress: false
jobs:
  bind:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: uvenaro-account-staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: uvenaro-bounded-provider-adapter-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate secret and safe-off prerequisites
        shell: bash
        run: |
          set -euo pipefail
          key="${GEMINI_API_KEY:-}"
          test -n "$key"
          test "${#key}" -ge 20
          test "${#key}" -le 256
          case "$key" in *$'\n'*|*$'\r'*) exit 1 ;; esac
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          echo "Secret and Cloudflare credentials are present; generation remains off."
      - name: Bind key to private Worker
        shell: bash
        run: |
          set -euo pipefail
          payload="$(GEMINI_API_KEY="$GEMINI_API_KEY" python3 - <<'PY'
          import json, os
          print(json.dumps({"name":"GEMINI_API_KEY","text":os.environ["GEMINI_API_KEY"],"type":"secret_text"}))
          PY
          )"
          response="$(curl --fail-with-body --silent --show-error --location --max-time 30 \
            -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets")"
          RESPONSE="$response" python3 - <<'PY'
          import json, os, sys
          body=json.loads(os.environ["RESPONSE"])
          if body.get("success") is not True:
              sys.exit("Cloudflare secret write was not acknowledged")
          result=body.get("result") or {}
          if result.get("name") != "GEMINI_API_KEY" or result.get("type") != "secret_text":
              sys.exit("Cloudflare secret acknowledgement was incomplete")
          print("Private Worker secret binding acknowledged; key value was not printed.")
          PY
      - name: Verify private binding and safe-off runtime
        shell: bash
        run: |
          set -euo pipefail
          settings="$(curl --fail-with-body --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")"
          SETTINGS="$settings" python3 - <<'PY'
          import json, os, sys
          body=json.loads(os.environ["SETTINGS"])
          if body.get("success") is not True:
              sys.exit("Cloudflare settings read was not acknowledged")
          settings=body.get("result") or {}
          bindings=settings.get("bindings") or []
          key=next((b for b in bindings if b.get("name")=="GEMINI_API_KEY"), None)
          if not key or key.get("type")!="secret_text":
              sys.exit("GEMINI_API_KEY binding was not verified")
          vars={b.get("name"):b.get("text") for b in bindings if b.get("type")=="plain_text"}
          if vars.get("GEMINI_GENERATION_ENABLED") != "false":
              sys.exit("Generation safe-off gate is not false")
          if vars.get("GEMINI_EXECUTION_CONFIRMATION","") != "":
              sys.exit("Execution confirmation is unexpectedly present")
          print("Private binding verified; Gemini generation remains disabled.")
          PY
