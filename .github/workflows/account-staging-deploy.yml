name: Deploy account staging (manual)
on:
  workflow_dispatch:
    inputs:
      enable_auth:
        description: Enable invited-test-account authentication after Firebase settings are verified
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: uvenaro-account-staging-deploy
  cancel-in-progress: false
jobs:
  require-ci:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: node scripts/check-release-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  deploy:
    needs: require-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    environment: uvenaro-account-staging
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UVENARO_STAGING_DATABASE_ID: ${{ secrets.UVENARO_STAGING_DATABASE_ID }}
      UVENARO_STAGING_ORIGIN: ${{ vars.UVENARO_STAGING_ORIGIN }}
      UVENARO_STAGING_ALLOWED_EMAILS: ${{ secrets.UVENARO_STAGING_ALLOWED_EMAILS }}
      ACCOUNT_SESSION_KEY: ${{ secrets.ACCOUNT_SESSION_KEY }}
      UVENARO_STAGING_ENABLE_AUTH: ${{ inputs.enable_auth && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify:all
      - run: npm run verify:account-staging-ui
      - run: npm run verify:account-staging-build
      - name: Recheck main and all three CI workflows before remote changes
        run: node scripts/check-release-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run deploy:account-staging
      - run: npm run check:account-staging
