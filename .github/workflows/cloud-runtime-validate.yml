name: Cloud runtime validation
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify:all
      - run: npm run verify:rules
      - run: npm run verify:account-emulator
      - run: npm run verify:account-ui
      - run: npm run verify:chat-ui
      - run: npm run verify:account-staging-ui
      - run: npm run verify:account-staging-build
      - run: npm run verify:metered-gateway-build
      - run: npm run verify:gemini-adapter-build
      - run: npm run verify:isolated-staging-build
      - run: node --check backend/worker.mjs
      - run: node --check backend/firebase-auth.mjs
      - run: node --check backend/app-check.mjs
      - run: node --check backend/replay-guard.mjs
      - run: node --check backend/chat-billing.mjs
