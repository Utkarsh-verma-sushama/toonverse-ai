name: Security policy gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Reject high/critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Run security tests
        run: npm run verify:security
      - name: Run billing abuse and reconciliation tests
        run: npm run verify:billing
      - name: Syntax-check security-critical runtime
        run: |
          node --check backend/worker.mjs
          node --check backend/firebase-auth.mjs
          node --check backend/app-check.mjs
          node --check backend/replay-guard.mjs
          node --check backend/chat-billing.mjs
          node --check backend/chat-execution.mjs
          node --check backend/chat-activation.mjs
          node --check backend/chat-reconciliation.mjs
          node --check backend/chat-gateway-reconciliation.mjs
          node --check backend/metered-gateway.mjs
          node --check backend/gemini-adapter.mjs
