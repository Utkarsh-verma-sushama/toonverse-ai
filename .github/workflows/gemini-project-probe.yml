name: Probe Gemini project endpoint without generation


on:
  workflow_dispatch:
    inputs:
      model:
        description: Gemini model to verify with models.list and countTokens only
        required: true
        default: gemini-3.8-flash
        type: string


permissions:
  contents: read


concurrency:
  group: uvenaro-gemini-project-probe
  cancel-in-progress: false


jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: uvenaro-account-staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_PROBE_MODEL: ${{ inputs.model }}
      GEMINI_PROJECT_ID: ${{ vars.GEMINI_PROJECT_ID }}
      GEMINI_PROJECT_NUMBER: ${{ vars.GEMINI_PROJECT_NUMBER }}
      GEMINI_TIER: ${{ vars.GEMINI_TIER }}
      GEMINI_BILLING_ACCOUNT_ATTACHED: ${{ vars.GEMINI_BILLING_ACCOUNT_ATTACHED }}
      GEMINI_BINDING_READBACK: ${{ vars.GEMINI_BINDING_READBACK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run sanitized non-generation probe
        run: node scripts/probe-gemini-project.mjs
