name: Check Cloudflare deployment access (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-access-check.yml'
      - 'scripts/check-cloudflare-access.mjs'
      - 'scripts/inspect-isolated-staging.mjs'
      - 'backend/isolated-staging-ownership-reconciliation.mjs'
      - 'deploy/isolated-staging/verified-deployment.json'
      - 'deploy/isolated-staging/ownership-reconciliation.json'
      - 'scripts/verify-isolated-staging.test.mjs'
permissions:
  contents: read
concurrency:
  group: uvenaro-cloudflare-access-check
  cancel-in-progress: false
jobs:
  access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: uvenaro-account-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UVENARO_STAGING_DATABASE_ID: ${{ secrets.UVENARO_STAGING_DATABASE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Read existing Worker and staging D1 metadata without remote changes
        run: node scripts/check-cloudflare-access.mjs
      - name: Inspect isolated staging inventory, declared scopes and free plan without writes
        run: node scripts/inspect-isolated-staging.mjs
