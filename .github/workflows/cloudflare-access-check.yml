name: Check Cloudflare deployment access (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-access-check.yml'
      - 'scripts/check-cloudflare-access.mjs'
      - 'scripts/inspect-isolated-staging.mjs'
permissions:
  contents: read
concurrency:
  group: uvenaro-cloudflare-access-check
  cancel-in-progress: false
jobs:
  access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: uvenaro-account-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UVENARO_STAGING_DATABASE_ID: ${{ secrets.UVENARO_STAGING_DATABASE_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Read existing Worker and staging D1 metadata without remote changes
        run: node scripts/check-cloudflare-access.mjs
      - name: Inspect isolated staging inventory, declared scopes and free plan without writes
        run: node scripts/inspect-isolated-staging.mjs
