name: Prepare isolated staging databases (no source upload)
on:
  push:
    branches: [main]
    paths:
      - 'deploy/isolated-staging/provision-request.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: uvenaro-isolated-staging-resources
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: uvenaro-account-staging
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UVENARO_STAGING_DATABASE_ID: ${{ secrets.UVENARO_STAGING_DATABASE_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require exact main CI, then create only three empty isolated databases
        run: node scripts/provision-isolated-databases.mjs --remote
      - name: Preserve database intent, identities and offline Worker preparation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-staging-database-preparation
          path: .isolated-staging/
          if-no-files-found: ignore
          retention-days: 30
          include-hidden-files: true
