name: Verify Gemini staging secret wiring
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gemini-secret-wiring.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uvenaro-gemini-secret-wiring
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: uvenaro-account-staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_GENERATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify secret presence without revealing it
        shell: bash
        run: |
          set -euo pipefail
          key="${GEMINI_API_KEY:-}"
          test -n "$key"
          key_length="${#key}"
          test "$key_length" -ge 20
          test "$key_length" -le 256
          case "$key" in
            *$'\n'*|*$'\r'*) exit 1 ;;
          esac
          test "${GEMINI_GENERATION_ENABLED}" = 'false'
          echo "GEMINI_API_KEY is present; generation remains disabled."
