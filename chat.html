<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071020"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-src 'none'"><title>UVENARO Chat</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/uvenaro-icon.svg"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071020;color:#f5f8ff;font:16px/1.5 system-ui}header,main{max-width:900px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center}.chat{min-height:55vh;background:#0d1930;border:1px solid #2b4262;border-radius:18px;padding:16px;overflow:auto}.msg{max-width:82%;padding:11px 13px;margin:10px 0;border-radius:14px;white-space:pre-wrap}.user{margin-left:auto;background:#155e75}.assistant{background:#1e293b}.notice{color:#fcd34d}form{display:flex;gap:8px;margin-top:12px}textarea{flex:1;min-height:54px;max-height:180px;resize:vertical;background:#0d1930;color:#fff;border:1px solid #456184;border-radius:12px;padding:12px}button,a{color:#fff}button{min-height:48px;border:0;border-radius:12px;padding:0 18px;background:#2563eb;font-weight:750}button:disabled{opacity:.5}small{color:#9fb0c8}@media(max-width:620px){form{display:grid}.msg{max-width:94%}}</style></head><body><header><a href="index.html">← UVENARO</a><strong>Chat Core</strong><button id="clear" type="button">Clear</button></header><main><h1>UVENARO Chat</h1><p id="service" class="notice"></p><section id="log" class="chat" role="log" aria-live="polite"></section><form id="form"><textarea id="input" maxlength="12000" required placeholder="Ask UVENARO..."></textarea><button id="send">Send</button></form><small>Paid AI requests require entitlement, reserved credits, fair-use clearance and a server-side cost ceiling.</small></main><script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/chat-core.js"></script><script>const log=document.querySelector('#log'),input=document.querySelector('#input'),form=document.querySelector('#form');function render(){log.textContent='';for(const m of UvenaroChat.messages()){const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.content;log.append(d)}log.scrollTop=log.scrollHeight}render();document.querySelector('#service').textContent=UvenaroChat.connected()?'Secure AI service connected. Usage controls apply.':'Production AI service is not connected. Messages remain on this device and no paid request is sent.';form.onsubmit=async e=>{e.preventDefault();const text=input.value;input.value='';document.querySelector('#send').disabled=true;try{const out=await UvenaroChat.send(text);render();if(out.unavailable){const d=document.createElement('div');d.className='msg assistant notice';d.textContent='AI backend is not connected yet. Your message was saved locally without provider cost.';log.append(d)}}catch(err){const d=document.createElement('div');d.className='msg assistant notice';d.textContent=err.message;log.append(d)}finally{document.querySelector('#send').disabled=false;input.focus()}};document.querySelector('#clear').onclick=()=>{if(confirm('Clear local chat history?')){UvenaroChat.clear();render()}};</script></body></html>
