openapi: 3.1.0
info: {title: ToonVerse Core Intelligence API, version: 2.0.0}
servers: [{url: https://api.example.invalid}]
security: [{bearerAuth: []}]
paths:
  /v1/ai/routes:
    post:
      operationId: selectModelRoute
      summary: Select a short-lived, policy-compliant multimodal model route.
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoutePolicy"}
      responses:
        "200": {description: Route selected, content: {application/json: {schema: {$ref: "#/components/schemas/ModelRoute"}}}}
        "503": {description: No healthy policy-compliant route.}
  /v1/agents/runs:
    post:
      operationId: createAgentRun
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AgentRequest"}
      responses:
        "202": {description: Durable run queued, content: {application/json: {schema: {$ref: "#/components/schemas/AgentRun"}}}}
  /v1/agents/runs/{runId}:
    get:
      operationId: getAgentRun
      parameters: [{$ref: "#/components/parameters/RunId"}]
      responses:
        "200": {description: Current durable state, content: {application/json: {schema: {$ref: "#/components/schemas/AgentRun"}}}}
        "404": {description: Not found or not owned by caller.}
  /v1/agents/runs/{runId}/cancel:
    post:
      operationId: cancelAgentRun
      parameters: [{$ref: "#/components/parameters/RunId"}]
      responses: {"202": {description: Cancellation accepted.}}
  /v1/agents/runs/{runId}/approvals/{approvalId}:
    post:
      operationId: decideAgentApproval
      parameters:
        - {$ref: "#/components/parameters/RunId"}
        - {in: path, name: approvalId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties: {decision: {type: string, enum: [approve, deny]}, reason: {type: string, maxLength: 500}}
      responses: {"200": {description: Decision recorded.}}
components:
  parameters:
    RunId: {in: path, name: runId, required: true, schema: {type: string}}
  schemas:
    RoutePolicy:
      type: object
      required: [task, modalities]
      properties:
        task: {type: string, enum: [generate, edit, understand, ocr, transcribe, translate, summarize, math, safety]}
        modalities: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [text, image, video, audio, document]}}
        quality: {type: string, enum: [fast, balanced, high]}
        privacy: {type: string, enum: [standard, no-retention, regional]}
        region: {type: string}
        latencyBudgetMs: {type: integer, minimum: 1000, maximum: 120000}
        costCeilingUsd: {type: number, minimum: 0, maximum: 100}
        fallbacks: {type: integer, minimum: 0, maximum: 3}
    ModelRoute:
      type: object
      required: [routeId, provider, model, expiresAt, provenance]
      properties:
        routeId: {type: string}
        provider: {type: string}
        model: {type: string}
        fallbacks: {type: array, items: {type: object, required: [provider, model], properties: {provider: {type: string}, model: {type: string}}}}
        expiresAt: {type: string, format: date-time}
        provenance: {type: object, additionalProperties: true}
    AgentRequest:
      type: object
      required: [clientRunId, objective, limits, policy]
      properties:
        clientRunId: {type: string}
        objective: {type: string, minLength: 1, maxLength: 4000}
        context: {type: object, additionalProperties: true}
        tools: {type: array, maxItems: 32, uniqueItems: true, items: {type: string}}
        limits:
          type: object
          required: [maxSteps, maxRuntimeMs, maxCostUsd]
          properties: {maxSteps: {type: integer, minimum: 1, maximum: 50}, maxRuntimeMs: {type: integer, minimum: 5000, maximum: 3600000}, maxCostUsd: {type: number, minimum: 0, maximum: 100}}
        policy: {type: object, additionalProperties: true}
    AgentRun:
      type: object
      required: [id, status, objective, createdAt, updatedAt]
      properties:
        id: {type: string}
        status: {type: string, enum: [queued, planning, running, awaiting_approval, completed, failed, cancelled, expired]}
        objective: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        errorCode: {type: string}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
