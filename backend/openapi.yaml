openapi: 3.1.0
info:
  title: ToonVerse AI Backend API
  version: 1.0.0
  description: Secure, provider-independent contract for authenticated project synchronization.
servers:
  - url: https://api.example.invalid
    description: Replace only after the production backend is deployed.
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  version: { type: string }
  /v1/projects/sync:
    post:
      operationId: syncProject
      summary: Idempotently upload or delete one authenticated user's project.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
        - in: header
          name: X-ToonVerse-Schema
          required: true
          schema: { type: string, const: "1" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest:
                  type: string
                  format: binary
                  description: UTF-8 JSON project manifest. The server must ignore client-supplied ownership and derive the owner from the verified bearer token.
                original:
                  type: string
                  format: binary
                layer-0:
                  type: string
                  format: binary
                mask-0:
                  type: string
                  format: binary
      responses:
        "200":
          description: Change committed or previously committed with the same idempotency key.
          content:
            application/json:
              schema:
                type: object
                required: [ok, revision, projectId]
                properties:
                  ok: { type: boolean, const: true }
                  revision: { type: string }
                  projectId: { type: string }
                  syncedAt: { type: string, format: date-time }
        "400": { description: Invalid manifest, file, or schema. }
        "401": { description: Missing, expired, or invalid authentication. }
        "403": { description: Project ownership or policy check failed. }
        "409":
          description: The server has a newer revision and returns conflict metadata.
          content:
            application/json:
              schema:
                type: object
                required: [code, serverRevision]
                properties:
                  code: { type: string, const: PROJECT_CONFLICT }
                  serverRevision: { type: string }
                  serverUpdatedAt: { type: string, format: date-time }
        "413": { description: Upload exceeds the server's configured project limit. }
        "415": { description: Unsupported media type. }
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
        "500": { description: Internal error; the client retains the queued change. }
  /v1/ai/jobs:
    post:
      operationId: createAIJob
      summary: Create an authenticated, idempotent creative or multimodal job.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [clientJobId, mode, settings, media]
              properties:
                clientJobId: { type: string, minLength: 8, maxLength: 200 }
                mode:
                  type: string
                  enum: [generate, cartoon, wallpaper, coloring, memory, camera, image-text, video-text, batch, ai-enhance, auto-fix, background-remove, background-change, object-remove, upscale, restore, colorize, portrait, lighting, prompt-edit, image-understanding, video-understanding, audio-understanding, ocr, transcribe, translate, summarize, scene-index, accessibility-description]
                prompt: { type: string, maxLength: 4000 }
                settings: { type: string, description: UTF-8 JSON validated against the selected capability. }
                media:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: binary }
      responses:
        "202":
          description: Job accepted or replayed from the same idempotency key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIJob" }
        "400": { description: Invalid capability, settings or media. }
        "401": { description: Authentication required. }
        "403": { description: Consent, rights or safety policy failed. }
        "413": { description: Media exceeds configured limits. }
        "415": { description: MIME validation failed. }
        "429": { description: Rate limited; honor Retry-After. }
  /v1/ai/jobs/{jobId}:
    get:
      operationId: getAIJob
      parameters:
        - { in: path, name: jobId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Truthful processing state and any verified partial/final results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIJob" }
        "404": { description: Job not found or inaccessible. }
  /v1/ai/jobs/{jobId}/cancel:
    post:
      operationId: cancelAIJob
      parameters:
        - { in: path, name: jobId, required: true, schema: { type: string } }
      responses:
        "202": { description: Cancellation accepted and propagated. }
        "404": { description: Job not found or inaccessible. }
components:
  schemas:
    AIJob:
      type: object
      required: [id, status, progress]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, preparing, uploading, processing, completed, failed, cancelled, expired] }
        progress: { type: number, minimum: 0, maximum: 100 }
        completeness: { type: number, minimum: 0, maximum: 1 }
        result: { type: object, additionalProperties: true }
        outputs: { type: array, items: { type: object, additionalProperties: true } }
        warnings: { type: array, items: { type: string } }
        provenance: { type: object, additionalProperties: true }
        errorCode: { type: string }
        errorMessage: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
