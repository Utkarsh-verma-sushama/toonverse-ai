<body><a class="skip" href="#stage">Skip to camera preview</a><header><a href="index.html">✦ ToonVerse AI</a><h1>AI Camera & Visual Intelligence</h1><a href="library.html">Library</a></header><main><section class="stage gridOn" id="stage" aria-label="Camera and captured photo preview"><video id="camera" playsinline muted aria-label="Live camera preview"></video><img id="photo" alt="Captured or imported preview" hidden><canvas id="captureCanvas" hidden></canvas><div class="captureBar"><button class="btn" id="start">Start camera</button><button class="btn" id="switch" disabled>Switch</button><button class="btn shoot" id="shoot" disabled aria-label="Capture photo">●</button><button class="btn" id="torch" disabled aria-pressed="false">Torch</button><button class="btn" id="retake">Preview camera</button></div></section><aside class="panel"><small>CHECKPOINT 38</small><h2>Capture & understand</h2><label class="field">Import photo fallback<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif" capture="environment"></label><div class="checks"><label><input id="grid" type="checkbox" checked> Grid</label><label><input id="mirror" type="checkbox"> Mirror selfie</label></div><label class="field">Timer<select id="delay"><option value="0">Off</option><option value="3">3 seconds</option><option value="5">5 seconds</option><option value="10">10 seconds</option></select></label><label class="field" id="zoomWrap">Camera zoom<input id="cameraZoom" type="range" min="1" max="1" value="1" hidden></label><div class="row"><button class="btn" id="save" disabled>Save photo</button></div><hr style="border-color:#294465"><label class="field">Visual task<select id="mode"><option value="scene">Scene understanding</option><option value="objects">Objects & context</option><option value="text">Read visible text (OCR)</option><option value="document">Document scan</option><option value="accessibility">Accessibility description</option><option value="safety">Safet
