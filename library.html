<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>My Library | ToonVerse AI</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#fff;min-height:100vh;min-height:100dvh}
a,button{font:inherit}.skip{position:fixed;left:12px;top:-60px;z-index:10;background:#fff;color:#111;padding:10px;border-radius:8px}.skip:focus{top:12px}
header{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));background:#11182d;border-bottom:1px solid #27304d;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:800;color:#fff;text-decoration:none}nav{display:flex;flex-wrap:wrap;gap:8px}nav a{color:#dce4ff;text-decoration:none;padding:10px;border-radius:9px}nav a:hover,nav a:focus-visible{background:#1c2746;outline:2px solid #8b7bff;outline-offset:2px}
main{width:min(1100px,100%);margin:auto;padding:clamp(28px,6vw,64px) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.hero{text-align:center;margin-bottom:28px}.hero h1{font-size:clamp(30px,6vw,48px);margin:0 0 12px}.hero p{color:#b9c2da;line-height:1.6;margin:auto;max-width:720px}
.panel{background:#131c34;border:1px solid #263253;border-radius:18px;padding:clamp(20px,4vw,32px);box-shadow:0 18px 50px rgba(0,0,0,.2)}
.empty{text-align:center}.icon{font-size:46px}.card{display:grid;grid-template-columns:minmax(180px,320px) 1fr;gap:24px;align-items:center}.preview{width:100%;aspect-ratio:4/3;object-fit:contain;background:#080c18;border:1px solid #2a365a;border-radius:14px}.meta h2{margin:0 0 10px;overflow-wrap:anywhere}.details{color:#b9c2da;line-height:1.7}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:11px 18px;border:0;border-radius:10px;background:#6c63ff;color:#fff;text-decoration:none;font-weight:750;cursor:pointer}.btn.secondary{background:#1c2746}.btn.danger{background:#692d3b}.btn:focus-visible{outline:3px solid #c4bbff;outline-offset:2px}
.status{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#111a31;border:1px solid #34436e;padding:10px 14px;border-radius:10px;max-width:90vw}
@media(max-width:700px){.card{grid-template-columns:1fr}nav{width:100%;overflow-x:auto;flex-wrap:nowrap}.actions .btn{flex:1 1 150px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header>
<a class="logo" href="index.html">✨ ToonVerse AI</a>
<nav aria-label="Primary navigation">
<a href="index.html">Home</a><a href="create.html">Create</a><a href="editor.html">Editor</a><a href="library.html" aria-current="page">My Library</a>
</nav>
</header>
<main id="main">
<section class="hero"><h1>My Library</h1><p>Continue the latest project saved on this device. Your editor also keeps automatic crash recovery locally.</p></section>
<section class="panel" id="library-content" aria-live="polite"></section>
</main>
<div class="status" id="status" role="status" aria-live="polite" hidden></div>
<script>
"use strict";
(() => {
  const content=document.getElementById("library-content");
  const status=document.getElementById("status");
  const announce=message=>{status.textContent=message;status.hidden=false;setTimeout(()=>status.hidden=true,2400)};
  const escapeText=value=>String(value??"");
  let project=null;
  try{project=JSON.parse(localStorage.getItem("toonverse:editor:last-project")||"null")}catch(error){console.warn("Library metadata could not be read.",error)}
  if(!project){
    content.className="panel empty";
    const icon=document.createElement("div");icon.className="icon";icon.setAttribute("aria-hidden","true");icon.textContent="📁";
    const title=document.createElement("h2");title.textContent="No saved project yet";
    const text=document.createElement("p");text.className="details";text.textContent="Create something or save a project in the editor. Automatic recovery remains available there.";
    const actions=document.createElement("div");actions.className="actions";
    actions.innerHTML='<a class="btn" href="create.html">Create New Project</a><a class="btn secondary" href="editor.html">Open Editor</a>';
    content.append(icon,title,text,actions);
    return;
  }
  const card=document.createElement("article");card.className="card";
  if(project.preview){
    const image=document.createElement("img");image.className="preview";image.src=project.preview;image.alt="Saved project preview";card.appendChild(image);
  }
  const meta=document.createElement("div");meta.className="meta";
  const title=document.createElement("h2");title.textContent=escapeText(project.name||"Saved Project");
  const details=document.createElement("p");details.className="details";
  const saved=project.savedAt?new Date(project.savedAt):null;
  details.textContent=`${Number(project.width)||0} × ${Number(project.height)||0} pixels · ${saved&&!Number.isNaN(saved.valueOf())?saved.toLocaleString():"Saved locally"}`;
  const actions=document.createElement("div");actions.className="actions";
  const open=document.createElement("a");open.className="btn";open.href="editor.html";open.textContent="Continue Editing";
  const create=document.createElement("a");create.className="btn secondary";create.href="create.html";create.textContent="Create New";
  const remove=document.createElement("button");remove.className="btn danger";remove.type="button";remove.textContent="Remove from Device";
  remove.addEventListener("click",()=>{
    if(!confirm("Remove the locally saved project and its recovery data from this device?"))return;
    localStorage.removeItem("toonverse:editor:last-project");
    const request=indexedDB.deleteDatabase("toonverse-editor");
    request.onsuccess=request.onerror=request.onblocked=()=>{announce("Local project removed.");setTimeout(()=>location.reload(),500)};
  });
  actions.append(open,create,remove);meta.append(title,details,actions);card.appendChild(meta);content.appendChild(card);
})();
</script>
</body>
</html>
