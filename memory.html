<style>:root{color-scheme:dark;--b:#071020;--p:#101b34;--l:#2b3c60;--t:#f7f9ff;--m:#adbad4;--a:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1c2850,var(--b) 48%);color:var(--t);font:15px/1.5 system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}a{color:inherit}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:max(14px,env(safe-area-inset-top)) 18px 14px;background:#081225e8;border-bottom:1px solid var(--l);backdrop-filter:blur(15px)}main{max-width:1200px;margin:auto;padding:clamp(16px,3vw,34px)}h1{font-size:clamp(28px,5vw,52px);line-height:1.05;margin:8px 0}p{color:var(--m)}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:#101b34ed;border:1px solid var(--l);border-radius:20px;padding:20px}label{display:grid;gap:6px;margin:12px 0;font-weight:650}input,select{width:100%;background:#081225;color:var(--t);border:1px solid #3a4c70;border-radius:10px;padding:11px}.check{display:flex;align-items:flex-start;gap:8px;font-weight:500}.check input{width:auto;margin-top:5px}.drop{padding:22px;border:2px dashed #596b92;border-radius:15px;text-align:center;cursor:pointer}.drop input{position:absolute;opacity:0;width:1px}.btn{border:0;border-radius:11px;padding:12px 15px;background:#2b3b5d;color:white;font-weight:750;cursor:pointer;min-height:46px}.primary{background:linear-gradient(135deg,#7c5cff,#a855f7)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.timeline{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;min-height:180px}.item{background:#081225;border:1px solid var(--l);border-radius:13px;padding:10px;overflow:hidden}.thumb{height:90px;border-radius:8px;background:#182644;display:grid;place-items:center;font-size:28px}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--m);margin-top:7px}.status{margin-top:14px;padding:12px;background:#081225;border-radius:11px;color:var(--m);white-space:pre-wrap}.bar{height:8px;background:#071020;border-radius:99px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#8b5cf6,#4ade80)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b7a7ff;outline-offset:3px}@media(max-width:760px){.grid{grid-template-columns:1fr}}@media(min-width:1800px){body{font-size:20px}main{max-width:1600px}.btn{min-height:58px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}</style></head>
<body><header><a href="index.html">✦ ToonVerse AI</a><strong>Memory Studio</strong><a href="library.html">Library</a></header><main><small>CHECKPOINT 36</small><h1>Turn moments into respectful memory films.</h1><p>Arrange photos and clips, preserve every original, and prepare a recoverable timeline for secure rendering.</p><div class="grid"><form class="card" id="form"><label>Project title<input id="title" maxlength="120" value="My Memory"></label><label class="drop" id="drop" tabindex="0" role="button">Choose photos, video or audio<input id="files" type="file" multiple accept="image/*,video/*,audio/*"></label><label>Aspect ratio<select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>4:3</option></select></label><label>Output<select id="quality"><option>1080p</option><option>720p</option><option>4K</option></select></label><label>Motion<select id="motion"><option value="subtle">Subtle</option><option value="none">None</option><option value="cinematic">Cinematic</option></select></label><label class="check"><input id="consent" type="checkbox">I confirm rights and consent for the people and media used.</label><div class="actions"><button class="btn primary">Create timeline</button><button class="btn" type="button" id="render" disabled>Render securely</button><button class="btn" type="reset">Clear</button></div><div class="status" id="status" aria-live="polite" role="status">Ready. Nothing has left this device.</div><div class="bar"><i id="bar"></i></div></form><section class="card"><h2>Timeline</h2><p id="count">No items yet.</p><div class="timeline" id="timeline" aria-live="polite"></div></section></div></main>
<script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/ai-runtime.js"></script><script src="assets/js/memory-studio.js"></script><script>(()=>{"use strict";let files=[],project=null,job=null,timer;const $=x=>document.getElementById(x),status=$("status"),input=$("files"),drop=$("drop");function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function choose(list){files=Array.from(list||[]);$("count").textContent=files.length?files.length+" item(s) selected.":"No items yet.";$("timeline").innerHTML=files.map((f,i)=>'<article class="item" tabindex="0"><div class="thumb">'+(f.type.startsWith("image")?"🖼️":f.type.startsWith("video")?"🎞️":"🎵")+'</div><div class="name">'+(i+1)+". "+esc(f.name)+"</div></article>").join("");status.textContent=files.length?"Ready to create a recoverable timeline.":"Ready. Nothing has left this device."}input.onchange=()=>choose(input.files);drop.onclick=()=>input.click();drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();input.click()}};["dragover","drop"].forEach(n=>drop.addEventListener(n,e=>e.preventDefault()));drop.addEventListener("drop",e=>choose(e.dataTransfer.files));$("form").onsubmit=async e=>{e.preventDefault();try{project=ToonVerseMemory.create({files,title:$("title").value,aspectRatio:$("ratio").value,quality:$("quality").value,motion:$("motion").value,consent:$("consent").checked});await ToonVerseMemory.save(project);$("render").disabled=false;status.textContent="Timeline saved locally with "+project.items.length+" item(s). Originals are unchanged."}catch(x){status.textContent=x.message}};$("render").onclick=async()=>{try{job=await ToonVerseMemory.submit(project,files);if(!ToonVerseAIJobs.connected()){status.textContent="Timeline is ready. Connect the production rendering backend before media can be processed.";$("render").disabled=false;return}$("render").disabled=true;poll()}catch(x){status.textContent=x.message}};async function poll(){try{job=await ToonVerseAIJobs.status(job.id);$("bar").style.width=(job.progress||0)+"%";status.textContent=job.status+" · "+Math.round(job.progress||0)+"%";if(job.status==="completed"){$("render").disabled=false;status.textContent="Memory film completed and preserved as a new output.";return}if(["failed","cancelled","expired"].includes(job.status))throw Error(job.errorMessage||job.status);timer=setTimeout(poll,2000)}catch(x){$("render").disabled=false;status.textContent=x.message}}$("form").onreset=()=>setTimeout(()=>{files=[];project=null;job=null;clearTimeout(timer);choose([]);$("render").disabled=true;$("bar").style.width="0"},0)})();</script></body></html>
